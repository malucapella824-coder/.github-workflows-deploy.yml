name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Preparar modelos de exportação
        run: |
          echo "GODOT_VERSION=${GODOT_VERSION} HOME=${HOME}"
          DEST="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$HOME/.local/share/godot/export_templates"
          SRC=""
          for d in /root/.local/share/godot/export_templates/*stable* /root/.local/share/godot/templates/*stable*; do
            if [ -d "$d" ]; then SRC="$d"; break; fi
          done
          echo "Modelos encontrados em: $SRC"
          if [ -z "$SRC" ]; then
            echo "Nenhuma pasta de modelos encontrada. Conteúdo de /root/.local/share/godot:"
            ls -R /root/.local/share/godot | head -50
            exit 1
          fi
          if [ "$SRC" != "$DEST" ]; then
            rm -rf "$DEST"
            cp -r "$SRC" "$DEST"
          fi
          ls "$DEST" | head -20

      - name: Importar projeto
        run: godot --headless --import || true

      - name: Exportar para Web
        run: |
          mkdir -v -p build/web
          godot --headless --verbose --export-release "Web" build/web/index.html
          ls -la build/web

      - name: Enviar site
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4

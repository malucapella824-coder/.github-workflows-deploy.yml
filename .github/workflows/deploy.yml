name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Preparar modelos de exportação
        run: |
          DEST="$HOME/.local/share/godot/export_templates/4.3.stable"
          mkdir -p "$DEST"
          FOUND=$(find /root /opt /usr /home /github -name web_nothreads_release.zip 2>/dev/null | head -n 1)
          if [ -n "$FOUND" ]; then
            echo "Modelo Web encontrado em: $FOUND"
            cp -r "$(dirname "$FOUND")"/. "$DEST"/
          else
            echo "Modelo Web não está na imagem. Baixando os modelos oficiais do Godot 4.3..."
            wget -q -O /tmp/templates.tpz https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
            unzip -o -j /tmp/templates.tpz "templates/web_nothreads_*" "templates/version.txt" -d "$DEST"
          fi
          ls -la "$DEST"
          test -f "$DEST/web_nothreads_release.zip"

      - name: Importar projeto
        run: godot --headless --import || true

      - name: Exportar para Web
        run: |
          mkdir -v -p build/web
          godot --headless --verbose --export-release "Web" build/web/index.html
          ls -la build/web

      - name: Enviar site
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
